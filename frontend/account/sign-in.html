<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login | CURATOR EDITORIAL</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&amp;family=Manrope:wght@300;400;500;600;700&amp;family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<link rel="stylesheet" href="/frontend/css/global.css">
<script src="/frontend/js/tailwind-theme.js"></script>
</head>
<body class="bg-surface text-on-surface font-body selection:bg-secondary-fixed selection:text-on-secondary-fixed min-h-screen flex flex-col">
<!-- TopNavBar: Suppressed per shell visibility rules (Linear/Transactional Page) -->
<main class="flex-grow flex flex-col md:flex-row relative overflow-hidden">
<div class="absolute inset-0 subtle-noise"></div>
<!-- Left Column: Editorial Imagery -->
<div class="hidden md:flex md:w-1/2 bg-surface-container-low relative items-center justify-center p-12 lg:p-24 overflow-hidden">
<div class="absolute inset-0 z-0">
<img class="w-full h-full object-cover grayscale opacity-40" data-alt="Monochromatic architectural detail of a brutalist building with clean lines and soft shadows during twilight" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAy4mLWUeY7NQySTh4JiQ-c4hkNVjQkgQvAPXVWwk77Xb5Q37E1nVi5qunEMN3uPTQ40n5GaItRXhShu4V1N5MWWjdOL3IIHGo5Rsy67VspgF8T_DYfQzYPWTIPuq4S4YRYqGVitSUtJwwJpgQYRdNZXWSU89uvNO404qQaUILdVhSIlOB1kuzxYy20sU4yqObi1QlETCz9zMm8XUANqf-8VqhMNBeK3QxzliMiOOzkDimoeahdhSMW7DqSS2GX5eK0E7bp1rttzwse"/>
</div>
<div class="relative z-10 max-w-lg">
<h1 class="font-headline text-5xl lg:text-7xl tracking-tighter text-primary mb-8 leading-tight">
                    Refined <br/><span class="italic font-normal">Essentials</span>
</h1>
<p class="font-body text-lg text-on-surface-variant leading-relaxed max-w-sm">
                    Access your curated collection. A seamless transition from digital exploration to physical craftsmanship.
                </p>
<div class="mt-12 w-16 h-px bg-primary/20"></div>
</div>
</div>
<!-- Right Column: Login Form -->
<div class="w-full md:w-1/2 flex items-center justify-center p-6 sm:p-12 lg:p-24 bg-surface z-10">
<div class="w-full max-w-md">
<div class="mb-12 text-center md:text-left">
<h2 class="text-[0.65rem] tracking-[0.3em] uppercase font-label text-secondary mb-4">ETC Apparel</h2>
<h3 class="font-headline text-3xl text-primary">Welcome back</h3>
</div>
<form id="login-form" class="space-y-8">
<!-- Email Field -->
<div class="relative">
<label class="block text-[10px] font-label uppercase tracking-widest text-on-surface-variant mb-2" for="email">Email Address</label>
<input required class="w-full bg-surface-container-lowest border-none border-b border-outline-variant focus:border-primary focus:ring-0 transition-all duration-300 py-3 px-0 text-on-surface font-body placeholder:text-outline-variant/50" id="email" name="email" placeholder="name@example.com" type="email"/>
<div class="absolute bottom-0 left-0 w-full h-[1px] bg-outline-variant/30"></div>
</div>
<!-- Password Field -->
<div class="relative">
<div class="flex justify-between items-center mb-2">
<label class="block text-[10px] font-label uppercase tracking-widest text-on-surface-variant" for="password">Password</label>
<button type="button" onclick="showToast('Password reset link will be sent to your email.', 'info')" class="text-xs text-secondary hover:underline font-label">Forgot password?</button>
</div>
<input required class="w-full bg-surface-container-lowest border-none border-b border-outline-variant focus:border-primary focus:ring-0 transition-all duration-300 py-3 px-0 text-on-surface font-body placeholder:text-outline-variant/50" id="password" name="password" placeholder="••••••••" type="password"/>
<div class="absolute bottom-0 left-0 w-full h-[1px] bg-outline-variant/30"></div>
</div>
<!-- CTA Section -->
<div class="pt-4">
<button id="signin-btn" class="w-full editorial-gradient text-on-primary py-4 px-8 rounded-DEFAULT font-label text-xs uppercase tracking-[0.2em] shadow-sm hover:opacity-90 active:scale-[0.98] transition-all duration-300 flex justify-center items-center gap-3" type="submit">
                            <span>Sign In</span>
                        </button>
</div>
<!-- Divider -->
<div class="relative py-6 flex items-center justify-center">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/15"></div>
</div>
<span class="relative px-4 bg-surface text-[10px] font-label uppercase tracking-widest text-on-surface-variant">Or continue with</span>
</div>
<!-- Social Logins -->
<div class="space-y-4 mb-8">
                    <button type="button" onclick="showToast('Google sign-in coming soon!', 'info')" class="w-full py-4 border border-outline-variant/30 flex items-center justify-center gap-4 hover:bg-surface-container-low transition-all font-label font-semibold text-sm text-on-surface">
                        <img alt="Google" class="w-5 h-5" src="https://www.svgrepo.com/show/355037/google.svg"/>
                        Continue with Google
                    </button>
                    <button type="button" onclick="showToast('Apple sign-in coming soon!', 'info')" class="w-full py-4 border border-outline-variant/30 flex items-center justify-center gap-4 hover:bg-surface-container-low transition-all font-label font-semibold text-sm text-on-surface">
                        <svg class="w-5 h-5" fill="currentColor" viewbox="0 0 24 24"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.453 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09z"/></svg>
                        Continue with Apple
                    </button>
                </div>
<!-- Create Account -->
<div class="text-center pt-8">
<p class="text-[11px] font-body text-on-surface-variant">
                            New to Curator? <a class="text-primary font-semibold hover:underline decoration-secondary/30 underline-offset-4 ml-1" href="/frontend/account/create-account.html">Create an account</a>
</p>
</div>
</form>
</div>
</div>
</main>
<!-- Footer: Shared Component -->
<div id="footer-placeholder"></div>

    <script src="/frontend/components/header.js"></script>
    <script src="/frontend/components/footer.js"></script>
    <script src="/frontend/js/api.js"></script>
    <script src="/frontend/js/auth.js"></script>
    <script>
        loadHeader();
        loadFooter();
        
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('signin-btn');
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            if (!email || !password) return;

            // Loading state
            const originalContent = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin text-sm">progress_activity</span> Authenticating...`;

            try {
                await loginUser(email, password);
            } catch (err) {
                console.error(err);
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalContent;
            }
        });
    </script>
</body></html>
