<div class="hidden lg:block relative overflow-hidden group">

<div class="absolute inset-0 bg-primary/20 backdrop-multiply"></div>
<div class="absolute bottom-12 left-12 right-12 z-10">
<h2 class="font-headline text-4xl text-on-primary tracking-tight mb-4">Join the Collective</h2>
<p class="text-on-primary-container text-lg font-light leading-relaxed max-w-md">Access exclusive archival drops and sustainable craft storytelling. Curated for the modern wardrobe.</p>
</div>
</div>
<div class="p-8 md:p-16 lg:p-20 flex flex-col justify-center">
<div class="mb-12">
<h1 class="text-2xl font-serif tracking-[0.2em] uppercase text-primary mb-2">CURATOR</h1>
<p class="text-on-surface-variant font-label text-sm tracking-widest uppercase">Editorial Registration</p>
</div>
<form id="register-form" class="space-y-8">
<div class="space-y-6">
<div class="relative">
<label class="block text-xs font-label uppercase tracking-widest text-on-surface-variant mb-2" for="full-name">Full Name</label>
<input class="w-full bg-surface-container-lowest border-0 border-b border-outline-variant/30 py-3 focus:ring-0 focus:border-primary transition-all placeholder:text-outline-variant/60 font-body" id="full-name" name="full-name" placeholder="Evelyn Thorne" type="text"/>
</div>
<div class="relative">
<label class="block text-xs font-label uppercase tracking-widest text-on-surface-variant mb-2" for="email">Email Address</label>
<input class="w-full bg-surface-container-lowest border-0 border-b border-outline-variant/30 py-3 focus:ring-0 focus:border-primary transition-all placeholder:text-outline-variant/60 font-body" id="email" name="email" placeholder="e.thorne@curator.com" type="email"/>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="relative">
<label class="block text-xs font-label uppercase tracking-widest text-on-surface-variant mb-2" for="password">Password</label>
<input class="w-full bg-surface-container-lowest border-0 border-b border-outline-variant/30 py-3 focus:ring-0 focus:border-primary transition-all placeholder:text-outline-variant/60 font-body" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
<div class="relative">
<label class="block text-xs font-label uppercase tracking-widest text-on-surface-variant mb-2" for="confirm-password">Confirm Password</label>
<input class="w-full bg-surface-container-lowest border-0 border-b border-outline-variant/30 py-3 focus:ring-0 focus:border-primary transition-all placeholder:text-outline-variant/60 font-body" id="confirm-password" name="confirm-password" placeholder="••••••••" type="password"/>
</div>
</div>
</div>
<div class="flex items-start gap-3">
<div class="flex items-center h-5">
<input class="h-4 w-4 rounded-sm border-outline-variant text-primary focus:ring-offset-0 focus:ring-primary" id="newsletter" name="newsletter" type="checkbox"/>
</div>
<div class="text-sm">
<label class="font-body text-on-surface-variant leading-none" for="newsletter">
                                Subscribe to the <span class="font-semibold text-primary">Curator Newsletter</span> for early access and editorial insights.
                            </label>
</div>
</div>
<div class="pt-4 flex flex-col gap-6">
<button class="w-full py-4 bg-gradient-to-br from-primary to-primary-container text-on-primary font-label uppercase tracking-[0.15em] text-xs hover:opacity-90 transition-all flex items-center justify-center gap-2 group" type="submit">
                            Create Account
                            <span class="material-symbols-outlined text-sm group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
<div class="flex items-center gap-4">
<div class="h-[1px] flex-grow bg-outline-variant/15"></div>
<span class="text-[10px] font-label uppercase tracking-widest text-on-surface-variant">or join with</span>
<div class="h-[1px] flex-grow bg-outline-variant/15"></div>
</div>
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-3 py-3 border border-outline-variant/15 hover:bg-surface-container transition-colors" type="button">
<img alt="Google" class="w-4 h-4" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBy94miu5TkpKkvcs_7xF3fiEzX_IS0CKgQdMxzXjXcS_yHRJbeIoniu77AI_PBM4A72MoYFrqwAQzR0DfX5wy29trPqDKWPf_3YUC-dqzrZcM9M5JM9_3o8Gr_xc_YOzQ6_fMvhggAVCcauK3xiAQQyzQHdm3C9KzE59ZdthcgObP8Tban0N3llRnRXti-__Rn_SJhDAy-nESr1WorwozkxawEhscGaKYyrJxCobE3yZaTWrL40gpgSqx7plfXraDwOT1dnFY6Skmz"/>
<span class="text-[10px] font-label uppercase tracking-widest">Google</span>
</button>
<button class="flex items-center justify-center gap-3 py-3 border border-outline-variant/15 hover:bg-surface-container transition-colors" type="button">
<img alt="Apple" class="w-4 h-4" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBFgFjJvNyfN092O1_lB91P6VrjE3aiuF0XvvUJ-m9niO5oJZrpWjiHhnM2ACuxwUb5MvvyUy24QJF9QEKYNSKuhAhFC5azsg4d7UpJk28tO_KeNwiyEJyYxKe97QPvkj-Dj8I_kwjb1d9iBPB2o9-7pd1l2NbDM2ykIpY_5BIkorirwdtqNolEviNMFtTyJV8K83M3e2xfzxorBQLr-a4fhz8VfK6AbSDLaeBWgqDtLIqAL1Rr-oKKkwlUb_fz_ZQF-UkBB36gGbMG"/>
<span class="text-[10px] font-label uppercase tracking-widest">Apple</span>
</button>
</div>
</div>
</form>
<div class="mt-12 text-center">
<p class="text-sm text-on-surface-variant">
                        Already have an account? 
                        <a class="text-primary font-semibold hover:text-secondary underline underline-offset-4 transition-colors" href="/account/sign-in.html">Sign In</a>
</p>
</div>
</div>
</div>
</main>
<div id="footer-placeholder"></div>

    <script src="/frontend/components/header.js"></script>
    <script src="/frontend/components/footer.js"></script>
    <script src="/frontend/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadHeader();
            loadFooter();
            
            const registerForm = document.getElementById('register-form');
            if (registerForm) {
                registerForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const name = document.getElementById('full-name').value;
                    const email = document.getElementById('email').value;
                    const password = document.getElementById('password').value;
                    const confirmPassword = document.getElementById('confirm-password').value;
                    
                    if (password !== confirmPassword) {
                        alert("Passwords do not match");
                        return;
                    }
                    registerUser(name, email, password);
                });
            }
        });
    </script>
</body></html>
