<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create Account | ETC Apparel</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&amp;family=Manrope:wght@300;400;600&amp;family=Inter:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<link rel="stylesheet" href="/frontend/css/global.css">
<script src="/frontend/js/tailwind-theme.js"></script>
</head>
<body class="bg-surface font-body text-on-surface min-h-screen flex flex-col grainy-surface">
<main class="flex-grow flex items-center justify-center px-6 py-12 md:py-24">
<div class="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-2 gap-0 overflow-hidden rounded-xl editorial-shadow bg-surface-container-lowest">
<div class="hidden lg:block relative overflow-hidden group">
<img alt="Editorial fashion" class="absolute inset-0 w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" data-alt="Minimalist editorial portrait of a person in high-end linen apparel against a warm beige textured wall with soft directional natural light" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDS6iwNMnhbAPWEdlbNqNDRU0_OV3fkI5Stlsx_uokqv5xdhiI3K_KGwvceXqfrjEP2WjpTsx8yjfzIaBAiOBHQ8WNgaTRLuXXbqYvIbir-MHKFhngSWwHrpfD570zBf60CtraOyheRSV0vbk6RNCI5eShyPiy-gVYEG-qw0-4VRXCktADXRHRtEY0DrDXEmeMHVM5OiYfo5A6eAkf3C0IoAHwoSjAXp0t8tgonNv54m0MAN0dNmpTlwVnr_rWZIHBSNvRn6Nipg6WB"/>
<div class="absolute inset-0 bg-primary/20 backdrop-multiply"></div>
<div class="absolute bottom-12 left-12 right-12 z-10">
<h2 class="font-headline text-4xl text-on-primary tracking-tight mb-4">Join the Collective</h2>
<p class="text-on-primary-container text-lg font-light leading-relaxed max-w-md">Access exclusive archival drops and sustainable craft storytelling. Curated for the modern wardrobe.</p>
</div>
</div>
<div class="p-8 md:p-16 lg:p-20 flex flex-col justify-center">
<div class="mb-12">
<h1 class="text-2xl font-serif tracking-[0.2em] uppercase text-primary mb-2">CURATOR</h1>
<p class="text-on-surface-variant font-label text-sm tracking-widest uppercase">Editorial Registration</p>
</div>
<form id="register-form" class="space-y-8">
<div class="space-y-6">
<div class="relative">
<label class="block text-xs font-label uppercase tracking-widest text-on-surface-variant mb-2" for="full-name">Full Name</label>
<input required class="w-full bg-surface-container-lowest border-0 border-b border-outline-variant/30 py-3 focus:ring-0 focus:border-primary transition-all placeholder:text-outline-variant/60 font-body" id="full-name" name="full-name" placeholder="Evelyn Thorne" type="text"/>
</div>
<div class="relative">
<label class="block text-xs font-label uppercase tracking-widest text-on-surface-variant mb-2" for="email">Email Address</label>
<input required class="w-full bg-surface-container-lowest border-0 border-b border-outline-variant/30 py-3 focus:ring-0 focus:border-primary transition-all placeholder:text-outline-variant/60 font-body" id="email" name="email" placeholder="e.thorne@curator.com" type="email"/>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="relative">
<label class="block text-xs font-label uppercase tracking-widest text-on-surface-variant mb-2" for="password">Password</label>
<input required class="w-full bg-surface-container-lowest border-0 border-b border-outline-variant/30 py-3 focus:ring-0 focus:border-primary transition-all placeholder:text-outline-variant/60 font-body" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
<div class="relative">
<label class="block text-xs font-label uppercase tracking-widest text-on-surface-variant mb-2" for="confirm-password">Confirm Password</label>
<input required class="w-full bg-surface-container-lowest border-0 border-b border-outline-variant/30 py-3 focus:ring-0 focus:border-primary transition-all placeholder:text-outline-variant/60 font-body" id="confirm-password" name="confirm-password" placeholder="••••••••" type="password"/>
</div>
</div>
</div>
<div class="flex items-start gap-3">
<div class="flex items-center h-5">
<input class="h-4 w-4 rounded-sm border-outline-variant text-primary focus:ring-offset-0 focus:ring-primary" id="newsletter" name="newsletter" type="checkbox"/>
</div>
<div class="text-sm">
<label class="font-body text-on-surface-variant leading-none" for="newsletter">
                                Subscribe to the <span class="font-semibold text-primary">Curator Newsletter</span> for early access and editorial insights.
                            </label>
</div>
</div>
<div class="pt-4 flex flex-col gap-6">
<button id="register-btn" class="w-full py-4 bg-gradient-to-br from-primary to-primary-container text-on-primary font-label uppercase tracking-[0.15em] text-xs hover:opacity-90 transition-all flex items-center justify-center gap-2 group" type="submit">
                            <span>Create Account</span>
                            <span class="material-symbols-outlined text-sm group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
<div class="flex items-center gap-4">
<div class="h-[1px] flex-grow bg-outline-variant/15"></div>
<span class="text-[10px] font-label uppercase tracking-widest text-on-surface-variant">or join with</span>
<div class="h-[1px] flex-grow bg-outline-variant/15"></div>
</div>
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-3 py-3 border border-outline-variant/15 hover:bg-surface-container transition-colors" type="button">
<img alt="Google" class="w-4 h-4" src="https://www.svgrepo.com/show/355037/google.svg"/>
<span class="text-[10px] font-label uppercase tracking-widest">Google</span>
</button>
<button class="flex items-center justify-center gap-3 py-3 border border-outline-variant/15 hover:bg-surface-container transition-colors" type="button">
<svg class="w-4 h-4" fill="currentColor" viewbox="0 0 24 24"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.453 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09z"/></svg>
<span class="text-[10px] font-label uppercase tracking-widest">Apple</span>
</button>
</div>
</div>
</form>
<div class="mt-12 text-center">
<p class="text-sm text-on-surface-variant">
                        Already have an account? 
                        <a class="text-primary font-semibold hover:text-secondary underline underline-offset-4 transition-colors" href="/frontend/account/sign-in.html">Sign In</a>
</p>
</div>
</div>
</div>
</main>
<div id="footer-placeholder"></div>

    <script src="/frontend/components/header.js"></script>
    <script src="/frontend/components/footer.js"></script>
    <script src="/frontend/js/api.js"></script>
    <script src="/frontend/js/auth.js"></script>
    <script>
        loadHeader();
        loadFooter();
        
        const registerForm = document.getElementById('register-form');
        if (registerForm) {
            registerForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('register-btn');
                const name = document.getElementById('full-name').value.trim();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirm-password').value;
                
                if (password !== confirmPassword) {
                    showToast("Passwords do not match", "warning");
                    return;
                }

                // Loading state
                const originalContent = btn.innerHTML;
                btn.disabled = true;
                btn.innerHTML = `<span class="material-symbols-outlined animate-spin text-sm">progress_activity</span> Processing...`;

                try {
                    await registerUser(name, email, password);
                } catch (err) {
                    console.error(err);
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = originalContent;
                }
            });
        }
    </script>
</body></html>
