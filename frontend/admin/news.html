<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Atelier Admin | News &amp; Events</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&amp;family=Manrope:wght@300;400;600;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/frontend/css/global.css">
<script src="/frontend/js/tailwind-theme.js"></script>
</head>
<body class="bg-background text-on-background font-body custom-noise min-h-screen">
    <div id="admin-sidebar-placeholder"></div>
    <div id="admin-header-placeholder"></div>

    <main class="lg:ml-64 p-6 lg:p-12">
        <!-- Hero Section -->
        <header class="mb-16 flex flex-col md:flex-row justify-between items-start md:items-end gap-8 relative z-10">
            <div>
                <h1 class="font-headline text-4xl md:text-5xl font-bold text-primary tracking-tight mb-4">News &amp; Events</h1>
                <p class="text-on-surface-variant max-w-xl font-body leading-relaxed">
                    Manage the editorial voice and public engagements of ETC Apparel. Curate stories that define our heritage and schedule upcoming showcase events.
                </p>
            </div>
            <button onclick="openNewsModal()" class="flex items-center space-x-3 bg-gradient-to-br from-primary to-primary-container text-on-primary px-8 py-4 rounded shadow-lg hover:opacity-90 transition-all active:scale-95">
                <span class="material-symbols-outlined">add</span>
                <span class="font-label font-bold tracking-widest uppercase text-xs">New Entry</span>
            </button>
        </header>
        
        <!-- Filter Bar -->
        <section class="mb-12 flex flex-wrap items-center gap-3 relative z-10">
            <span class="text-xs font-label font-semibold text-outline uppercase tracking-widest mr-2">Filter by:</span>
            <button class="px-6 py-2 rounded-full bg-secondary text-on-secondary text-xs font-label font-medium shadow-sm">All Stories</button>
            <button class="px-6 py-2 rounded-full bg-surface-container-low text-on-surface-variant hover:bg-surface-container-high text-xs font-label font-medium transition-colors">Corporate</button>
            <button class="px-6 py-2 rounded-full bg-surface-container-low text-on-surface-variant hover:bg-surface-container-high text-xs font-label font-medium transition-colors">Collection Launch</button>
            <button class="px-6 py-2 rounded-full bg-surface-container-low text-on-surface-variant hover:bg-surface-container-high text-xs font-label font-medium transition-colors">Press</button>
        </section>
        
        <!-- News List -->
        <div id="news-list" class="space-y-8 relative z-10">
            <!-- News entries will be loaded here -->
            <div class="animate-pulse space-y-8">
                <div class="bg-surface-container-low h-40 rounded-lg w-full"></div>
                <div class="bg-surface-container-low h-40 rounded-lg w-full"></div>
            </div>
        </div>
    </main>

    <!-- News Modal -->
    <div id="news-modal" class="fixed inset-0 bg-black/60 z-[100] hidden items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl w-full max-w-2xl overflow-hidden shadow-2xl animate-in fade-in zoom-in duration-300">
            <div class="p-8 border-b border-outline-variant/10 flex justify-between items-center bg-surface-container-low/30">
                <h3 class="font-headline text-2xl font-bold text-primary">Create Editorial Entry</h3>
                <button onclick="closeNewsModal()" class="text-on-surface-variant hover:text-primary transition-colors">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <form id="add-news-form" class="p-8 space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label class="text-[10px] font-label font-bold uppercase tracking-widest text-on-surface-variant">Title</label>
                        <input name="title" required type="text" placeholder="Entry Title" class="w-full bg-surface-container-low border-none rounded-lg p-3 font-body focus:ring-2 focus:ring-primary/20">
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-label font-bold uppercase tracking-widest text-on-surface-variant">Category</label>
                        <select name="category" class="w-full bg-surface-container-low border-none rounded-lg p-3 font-body focus:ring-2 focus:ring-primary/20">
                            <option>Corporate</option>
                            <option>Collection Launch</option>
                            <option>Press</option>
                        </select>
                    </div>
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-label font-bold uppercase tracking-widest text-on-surface-variant">Excerpt</label>
                    <textarea name="excerpt" rows="2" placeholder="Brief summary for list view..." class="w-full bg-surface-container-low border-none rounded-lg p-3 font-body focus:ring-2 focus:ring-primary/20"></textarea>
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-label font-bold uppercase tracking-widest text-on-surface-variant">Image URL</label>
                    <input name="image_url" type="url" placeholder="https://..." class="w-full bg-surface-container-low border-none rounded-lg p-3 font-body focus:ring-2 focus:ring-primary/20">
                </div>
                <div class="flex justify-end gap-4 mt-8">
                    <button type="button" onclick="closeNewsModal()" class="px-8 py-3 text-sm font-label font-bold uppercase tracking-widest text-on-surface-variant hover:bg-surface-container-low rounded transition-all">Cancel</button>
                    <button type="submit" class="px-10 py-3 bg-primary text-on-primary text-sm font-label font-bold uppercase tracking-widest rounded shadow-lg hover:opacity-90 transition-all active:scale-95">Publish Entry</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/frontend/components/admin-sidebar.js"></script>
    <script src="/frontend/components/admin-header.js"></script>
    <script src="/frontend/js/auth.js"></script>
    <script src="/frontend/js/api.js"></script>
    <script>
        protectAdminRoute();
        loadAdminSidebar();
        loadAdminHeader();

        function openNewsModal() {
            document.getElementById('news-modal').classList.remove('hidden');
            document.getElementById('news-modal').classList.add('flex');
        }

        function closeNewsModal() {
            document.getElementById('news-modal').classList.add('hidden');
            document.getElementById('news-modal').classList.remove('flex');
        }

        async function loadNews() {
            const newsList = await fetchNews();
            const container = document.getElementById('news-list');
            
            if (newsList && newsList.length > 0) {
                container.innerHTML = newsList.map(entry => `
                    <div class="bg-surface-container-low p-1 rounded-lg group transition-all">
                        <div class="bg-surface-container-lowest p-6 rounded flex items-center space-x-6">
                            <div class="w-32 h-32 flex-shrink-0 overflow-hidden rounded bg-surface-container-high">
                                <img alt="${entry.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" src="${entry.image_url || 'https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&q=80'}"/>
                            </div>
                            <div class="flex-1">
                                <div class="flex justify-between items-start mb-2">
                                    <span class="bg-secondary-fixed text-on-secondary-fixed text-[10px] font-label font-bold px-2 py-1 rounded-full uppercase">${entry.category}</span>
                                    <span class="flex items-center text-[10px] font-label text-green-600 font-bold uppercase">
                                        <span class="w-2 h-2 bg-green-500 rounded-full mr-2"></span> ${entry.status || 'Published'}
                                    </span>
                                </div>
                                <h3 class="font-headline text-xl font-bold text-primary mb-2">${entry.title}</h3>
                                <p class="text-on-surface-variant text-sm line-clamp-2 font-body mb-4">${entry.excerpt}</p>
                                <div class="flex items-center text-[10px] text-outline font-label uppercase tracking-widest space-x-4">
                                    <span>Created: ${new Date(entry.created_at).toLocaleDateString()}</span>
                                    <span>Author: ${entry.author || 'Admin'}</span>
                                </div>
                            </div>
                            <div class="flex flex-col space-y-2">
                                <button class="p-2 text-outline hover:text-primary transition-colors"><span class="material-symbols-outlined">edit</span></button>
                                <button class="p-2 text-outline hover:text-error transition-colors" onclick="handleDeleteNews(${entry.id})"><span class="material-symbols-outlined">delete</span></button>
                            </div>
                        </div>
                    </div>
                `).join('');
            } else {
                container.innerHTML = '<div class="text-center py-20 text-on-surface-variant font-serif italic">No editorial entries found. Start by creating a new entry.</div>';
            }
        }

        async function handleDeleteNews(id) {
            if (confirm('Are you sure you want to delete this entry?')) {
                const response = await fetch(\`\${API_BASE_URL}/news/\${id}\`, {
                    method: 'DELETE',
                    headers: getHeaders()
                });
                if (response.ok) {
                    loadNews();
                }
            }
        }

        document.getElementById('add-news-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const newsData = {
                title: formData.get('title'),
                category: formData.get('category'),
                excerpt: formData.get('excerpt'),
                image_url: formData.get('image_url'),
                author: 'Master Curator'
            };

            const result = await createNews(newsData);
            if (result) {
                closeNewsModal();
                loadNews();
            } else {
                alert('Failed to publish entry.');
            }
        });

        document.addEventListener('DOMContentLoaded', loadNews);
    </script>

</body>
</html>
