<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Atelier Admin | Orders</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700;900&family=Manrope:wght@300;400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/frontend/css/global.css">
<script src="/frontend/js/tailwind-theme.js"></script>
</head>
<body class="bg-background text-on-background font-body custom-noise min-h-screen">
    <div id="admin-sidebar-placeholder"></div>
    <div id="admin-header-placeholder"></div>

    <main class="lg:ml-64 p-6 lg:p-12">
        <header class="mb-12 flex flex-col md:flex-row justify-between items-start md:items-end gap-6">
            <div>
                <h1 class="font-headline text-4xl md:text-5xl font-bold text-primary tracking-tight mb-2">Transaction Archive</h1>
                <p class="text-on-surface-variant font-body">Manage, review, and update all customer orders.</p>
            </div>
            <div class="flex gap-3 flex-wrap">
                <button onclick="exportOrdersCSV()" class="flex items-center gap-2 px-6 py-3 border border-outline-variant/20 hover:bg-surface-container-low transition-colors rounded font-label text-sm text-primary">
                    <span class="material-symbols-outlined text-base">file_download</span> Export Manifest
                </button>
                <button onclick="openCreateOrderModal()" class="flex items-center gap-2 bg-gradient-to-br from-primary to-primary-container text-on-primary px-8 py-3 rounded shadow-lg hover:opacity-90 active:scale-95 transition-all font-label font-bold text-xs uppercase tracking-widest">
                    <span class="material-symbols-outlined">add</span> Create New Order
                </button>
            </div>
        </header>

        <!-- Filter Tabs -->
        <div class="mb-8 flex flex-wrap items-center gap-3">
            <span class="text-xs font-label font-semibold text-outline uppercase tracking-widest">Status:</span>
            <button onclick="setOrderFilter('all')" id="filter-all" class="order-filter-btn px-5 py-2 rounded-full bg-secondary text-on-secondary text-xs font-label font-medium shadow-sm">All</button>
            <button onclick="setOrderFilter('Pending')" id="filter-Pending" class="order-filter-btn px-5 py-2 rounded-full bg-surface-container-low text-on-surface-variant hover:bg-surface-container-high text-xs font-label transition-colors">Pending</button>
            <button onclick="setOrderFilter('Processing')" id="filter-Processing" class="order-filter-btn px-5 py-2 rounded-full bg-surface-container-low text-on-surface-variant hover:bg-surface-container-high text-xs font-label transition-colors">Processing</button>
            <button onclick="setOrderFilter('Shipped')" id="filter-Shipped" class="order-filter-btn px-5 py-2 rounded-full bg-surface-container-low text-on-surface-variant hover:bg-surface-container-high text-xs font-label transition-colors">Shipped</button>
            <button onclick="setOrderFilter('Delivered')" id="filter-Delivered" class="order-filter-btn px-5 py-2 rounded-full bg-surface-container-low text-on-surface-variant hover:bg-surface-container-high text-xs font-label transition-colors">Delivered</button>
            <button onclick="setOrderFilter('Cancelled')" id="filter-Cancelled" class="order-filter-btn px-5 py-2 rounded-full bg-surface-container-low text-on-surface-variant hover:bg-surface-container-high text-xs font-label transition-colors">Cancelled</button>
        </div>

        <!-- Orders Table -->
        <div class="bg-surface-container-lowest rounded-xl overflow-hidden ring-1 ring-outline-variant/10">
            <div class="overflow-x-auto">
                <table class="w-full text-left min-w-[700px]">
                    <thead class="bg-surface-container-low/50 border-b border-outline-variant/10">
                        <tr>
                            <th class="px-8 py-5 text-[10px] font-bold uppercase tracking-widest text-on-surface-variant">Order #</th>
                            <th class="px-6 py-5 text-[10px] font-bold uppercase tracking-widest text-on-surface-variant">Customer</th>
                            <th class="px-6 py-5 text-[10px] font-bold uppercase tracking-widest text-on-surface-variant">Date</th>
                            <th class="px-6 py-5 text-[10px] font-bold uppercase tracking-widest text-on-surface-variant text-right">Amount</th>
                            <th class="px-6 py-5 text-[10px] font-bold uppercase tracking-widest text-on-surface-variant text-center">Status</th>
                            <th class="px-8 py-5 text-right text-[10px] font-bold uppercase tracking-widest text-on-surface-variant">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="orders-table-body" class="divide-y divide-outline-variant/5">
                        <tr><td colspan="6" class="px-8 py-12 text-center text-on-surface-variant font-serif italic">Loading orders...</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="px-8 py-6 flex justify-between items-center bg-surface-container-low/20">
                <p id="order-count-label" class="text-xs font-label text-on-surface-variant/60">Loading...</p>
                <div class="flex space-x-2">
                    <button onclick="changePage(-1)" class="w-10 h-10 flex items-center justify-center border border-outline-variant/20 rounded hover:bg-surface-container-low transition-colors">
                        <span class="material-symbols-outlined text-sm">chevron_left</span>
                    </button>
                    <button id="page-indicator" class="w-10 h-10 flex items-center justify-center bg-primary text-white rounded text-xs font-bold font-label">1</button>
                    <button onclick="changePage(1)" class="w-10 h-10 flex items-center justify-center border border-outline-variant/20 rounded hover:bg-surface-container-low transition-colors">
                        <span class="material-symbols-outlined text-sm">chevron_right</span>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Order Detail Modal -->
    <div id="order-detail-modal" class="fixed inset-0 z-[200] hidden items-center justify-center p-4">
        <div class="absolute inset-0 bg-primary/40 backdrop-blur-sm" onclick="closeDetailModal()"></div>
        <div class="relative bg-surface w-full max-w-lg p-10 rounded-xl shadow-2xl">
            <h2 class="text-2xl font-headline font-bold text-primary mb-6">Order Details</h2>
            <div id="order-detail-content" class="space-y-4 text-sm font-body"></div>
            <button onclick="closeDetailModal()" class="mt-8 w-full py-3 border border-outline-variant/20 font-label text-xs uppercase tracking-widest text-primary hover:bg-surface-container transition-colors rounded">Close</button>
        </div>
    </div>

    <!-- Update Status Modal -->
    <div id="update-status-modal" class="fixed inset-0 z-[200] hidden items-center justify-center p-4">
        <div class="absolute inset-0 bg-primary/40 backdrop-blur-sm" onclick="closeUpdateModal()"></div>
        <div class="relative bg-surface w-full max-w-sm p-10 rounded-xl shadow-2xl">
            <h2 class="text-2xl font-headline font-bold text-primary mb-2">Update Status</h2>
            <p id="update-order-label" class="text-xs text-on-surface-variant font-label uppercase tracking-widest mb-8">Order #</p>
            <div class="space-y-3">
                <button onclick="submitStatusUpdate('Pending')" class="w-full py-3 border border-outline-variant/20 font-label text-xs uppercase tracking-widest hover:bg-orange-50 hover:border-orange-300 transition-colors rounded">Pending</button>
                <button onclick="submitStatusUpdate('Processing')" class="w-full py-3 border border-outline-variant/20 font-label text-xs uppercase tracking-widest hover:bg-blue-50 hover:border-blue-300 transition-colors rounded">Processing</button>
                <button onclick="submitStatusUpdate('Shipped')" class="w-full py-3 border border-outline-variant/20 font-label text-xs uppercase tracking-widest hover:bg-blue-50 hover:border-blue-300 transition-colors rounded">Shipped</button>
                <button onclick="submitStatusUpdate('Delivered')" class="w-full py-3 border border-outline-variant/20 font-label text-xs uppercase tracking-widest hover:bg-green-50 hover:border-green-300 transition-colors rounded">Delivered</button>
                <button onclick="submitStatusUpdate('Cancelled')" class="w-full py-3 border border-red-200 font-label text-xs uppercase tracking-widest text-error hover:bg-red-50 transition-colors rounded">Cancelled</button>
            </div>
            <button onclick="closeUpdateModal()" class="mt-4 w-full py-3 text-on-surface-variant font-label text-xs uppercase tracking-widest hover:text-primary transition-colors">Cancel</button>
        </div>
    </div>

    <!-- Create Order Modal -->
    <div id="create-order-modal" class="fixed inset-0 z-[200] hidden items-center justify-center p-4">
        <div class="absolute inset-0 bg-primary/40 backdrop-blur-sm" onclick="closeCreateOrderModal()"></div>
        <div class="relative bg-surface w-full max-w-md p-10 rounded-xl shadow-2xl">
            <h2 class="text-2xl font-headline font-bold text-primary mb-8">Create New Order</h2>
            <form id="create-order-form" class="space-y-6">
                <div>
                    <label class="text-[10px] font-label uppercase tracking-widest text-on-surface-variant block mb-2">Customer Name</label>
                    <input id="co-customer" required placeholder="Full Name" class="w-full bg-surface-container-low border-none rounded-lg p-3 font-body focus:ring-2 focus:ring-primary/20">
                </div>
                <div>
                    <label class="text-[10px] font-label uppercase tracking-widest text-on-surface-variant block mb-2">Customer Email</label>
                    <input id="co-email" type="email" placeholder="customer@email.com" class="w-full bg-surface-container-low border-none rounded-lg p-3 font-body focus:ring-2 focus:ring-primary/20">
                </div>
                <div>
                    <label class="text-[10px] font-label uppercase tracking-widest text-on-surface-variant block mb-2">Total Amount ($)</label>
                    <input id="co-amount" type="number" step="0.01" required placeholder="0.00" class="w-full bg-surface-container-low border-none rounded-lg p-3 font-body focus:ring-2 focus:ring-primary/20">
                </div>
                <div class="flex gap-4 pt-2">
                    <button type="submit" class="flex-grow editorial-gradient text-on-primary py-3 font-label text-xs uppercase tracking-widest rounded hover:opacity-90 transition-all">Create Order</button>
                    <button type="button" onclick="closeCreateOrderModal()" class="px-6 py-3 font-label text-xs uppercase tracking-widest text-on-surface-variant hover:text-primary transition-colors">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/frontend/js/utils.js"></script>
    <script src="/frontend/js/api.js"></script>
    <script src="/frontend/js/auth.js"></script>
    <script src="/frontend/components/admin-sidebar.js"></script>
    <script src="/frontend/components/admin-header.js"></script>
    <script>
        protectAdminRoute();
        loadAdminSidebar();
        loadAdminHeader();

        let allOrders = [], currentFilter = 'all', currentPage = 1;
        let activeOrderId = null, activeOrderNumber = '';
        const PER_PAGE = 10;
        const statusStyles = { Pending:'bg-orange-100 text-orange-800', Processing:'bg-blue-100 text-blue-800', Shipped:'bg-indigo-100 text-indigo-800', Delivered:'bg-green-100 text-green-800', Cancelled:'bg-red-100 text-red-800' };

        function setOrderFilter(f) {
            currentFilter = f; currentPage = 1;
            document.querySelectorAll('.order-filter-btn').forEach(b => b.className = 'order-filter-btn px-5 py-2 rounded-full bg-surface-container-low text-on-surface-variant hover:bg-surface-container-high text-xs font-label transition-colors');
            const ab = document.getElementById('filter-' + f);
            if (ab) ab.className = 'order-filter-btn px-5 py-2 rounded-full bg-secondary text-on-secondary text-xs font-label font-medium shadow-sm';
            renderOrders();
        }

        function getFiltered() { return currentFilter === 'all' ? allOrders : allOrders.filter(o => o.status === currentFilter); }
        function changePage(d) { const f = getFiltered(); currentPage = Math.max(1, Math.min(Math.ceil(f.length / PER_PAGE) || 1, currentPage + d)); renderOrders(); }

        function renderOrders() {
            const filtered = getFiltered();
            const start = (currentPage - 1) * PER_PAGE;
            const page = filtered.slice(start, start + PER_PAGE);
            document.getElementById('order-count-label').textContent = `Showing ${Math.min(start+1, filtered.length) || 0}–${Math.min(start + page.length, filtered.length)} of ${filtered.length} orders`;
            document.getElementById('page-indicator').textContent = currentPage;
            const tbody = document.getElementById('orders-table-body');
            if (!page.length) { tbody.innerHTML = '<tr><td colspan="6" class="px-8 py-12 text-center text-on-surface-variant font-serif italic">No orders match this filter.</td></tr>'; return; }
            tbody.innerHTML = page.map(o => {
                const sc = statusStyles[o.status] || 'bg-gray-100 text-gray-700';
                const initials = o.customer.split(' ').map(n => n[0]).join('').substring(0, 2);
                return `<tr class="hover:bg-surface-container-low/30 transition-colors">
                    <td class="px-8 py-5 font-label text-sm font-bold text-primary">${o.order_number}</td>
                    <td class="px-6 py-5"><div class="flex items-center gap-3"><div class="w-8 h-8 rounded-full editorial-gradient flex items-center justify-center text-[9px] font-bold text-white">${initials}</div><div><p class="text-sm font-semibold text-on-surface">${o.customer}</p>${o.customer_email ? `<p class="text-[10px] text-on-surface-variant font-label">${o.customer_email}</p>` : ''}</div></div></td>
                    <td class="px-6 py-5 text-xs font-label text-on-surface-variant">${new Date(o.created_at).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</td>
                    <td class="px-6 py-5 text-right font-headline font-bold text-secondary text-sm">$${parseFloat(o.amount).toFixed(2)}</td>
                    <td class="px-6 py-5 text-center"><span class="px-3 py-1 rounded-full text-[10px] font-bold uppercase ${sc}">${o.status}</span></td>
                    <td class="px-8 py-5 text-right"><div class="flex items-center justify-end gap-2">
                        <button onclick='showOrderDetail(${JSON.stringify(o)})' class="p-2 text-on-surface-variant hover:text-primary transition-colors" title="Details"><span class="material-symbols-outlined text-lg">visibility</span></button>
                        <button onclick="openUpdateModal(${o.id},'${o.order_number}')" class="p-2 text-on-surface-variant hover:text-secondary transition-colors" title="Update Status"><span class="material-symbols-outlined text-lg">edit</span></button>
                    </div></td>
                </tr>`;
            }).join('');
        }

        function showOrderDetail(o) {
            const sc = statusStyles[o.status] || '';
            document.getElementById('order-detail-content').innerHTML = `<div class="bg-surface-container-low rounded-lg p-6 space-y-4 text-sm">
                <div class="flex justify-between"><span class="font-bold text-primary">Order #</span><span>${o.order_number}</span></div>
                <div class="flex justify-between"><span class="font-bold text-primary">Customer</span><span>${o.customer}</span></div>
                ${o.customer_email ? `<div class="flex justify-between"><span class="font-bold text-primary">Email</span><span>${o.customer_email}</span></div>` : ''}
                <div class="flex justify-between"><span class="font-bold text-primary">Amount</span><span class="text-secondary font-bold">$${parseFloat(o.amount).toFixed(2)}</span></div>
                <div class="flex justify-between items-center"><span class="font-bold text-primary">Status</span><span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase ${sc}">${o.status}</span></div>
                <div class="flex justify-between"><span class="font-bold text-primary">Date</span><span>${new Date(o.created_at).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})}</span></div>
            </div>`;
            const m = document.getElementById('order-detail-modal');
            m.classList.remove('hidden'); m.classList.add('flex');
        }

        function closeDetailModal() { const m = document.getElementById('order-detail-modal'); m.classList.add('hidden'); m.classList.remove('flex'); }
        function openUpdateModal(id, num) { activeOrderId = id; activeOrderNumber = num; document.getElementById('update-order-label').textContent = 'Order # ' + num; const m = document.getElementById('update-status-modal'); m.classList.remove('hidden'); m.classList.add('flex'); }
        function closeUpdateModal() { const m = document.getElementById('update-status-modal'); m.classList.add('hidden'); m.classList.remove('flex'); }

        async function submitStatusUpdate(status) {
            if (!activeOrderId) return;
            const result = await updateOrderStatus(activeOrderId, status);
            if (result) { const i = allOrders.findIndex(o => o.id === activeOrderId); if (i !== -1) allOrders[i].status = status; renderOrders(); showToast(`Order ${activeOrderNumber} → ${status}`, 'success'); }
            else showToast('Failed to update status.', 'error');
            closeUpdateModal();
        }

        function openCreateOrderModal() { document.getElementById('create-order-form').reset(); const m = document.getElementById('create-order-modal'); m.classList.remove('hidden'); m.classList.add('flex'); }
        function closeCreateOrderModal() { const m = document.getElementById('create-order-modal'); m.classList.add('hidden'); m.classList.remove('flex'); }

        document.getElementById('create-order-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const order_number = 'ETC-' + Date.now();
            const result = await createOrder({ order_number, customer_name: document.getElementById('co-customer').value.trim(), customer_email: document.getElementById('co-email').value.trim(), total_amount: parseFloat(document.getElementById('co-amount').value) });
            if (result) { closeCreateOrderModal(); showToast('Order ' + order_number + ' created!', 'success'); allOrders = await fetchOrders(); renderOrders(); }
            else showToast('Failed to create order.', 'error');
        });

        function exportOrdersCSV() { exportToCSV(allOrders.map(o => ({'Order Number': o.order_number, Customer: o.customer, Email: o.customer_email || '', Amount: o.amount, Status: o.status, Date: new Date(o.created_at).toLocaleDateString()})), 'etc_orders_manifest.csv'); showToast('Manifest exported!', 'success'); }

        document.addEventListener('DOMContentLoaded', async () => { allOrders = await fetchOrders(); renderOrders(); });
    </script>
</body>
</html>
