<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>All Products | ETC Apparel</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700;900&family=Manrope:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="stylesheet" href="/frontend/css/global.css">
<script src="/frontend/js/tailwind-theme.js"></script>
<style>.silk-finish-gradient{background:linear-gradient(135deg,#171e29 0%,#2c333f 100%)}</style>
</head>
<body class="bg-surface font-body text-on-surface">
    <div id="header-placeholder"></div>

    <main class="pt-32 pb-24 px-8 md:px-16">
        <nav class="flex items-center gap-2 text-xs font-label uppercase tracking-widest text-on-surface-variant/60 mb-8">
            <a class="hover:text-secondary transition-colors" href="/frontend/index.html">Home</a>
            <span class="material-symbols-outlined text-[10px]">chevron_right</span>
            <span class="text-secondary font-semibold">Shop</span>
        </nav>
        <header class="mb-16">
            <h1 class="font-headline text-5xl md:text-7xl font-black text-primary tracking-tighter mb-4">The Seasonal <span class="text-secondary">Edit</span></h1>
            <p class="max-w-2xl text-on-surface-variant font-body leading-relaxed text-lg italic">A thoughtfully curated selection of essential garments for the modern editorial aesthetic.</p>
        </header>

        <div class="flex flex-col lg:flex-row gap-12">
            <!-- Sidebar Filters -->
            <aside class="w-full lg:w-72 flex-shrink-0 space-y-10">
                <section>
                    <h3 class="font-headline text-lg font-bold text-primary mb-6">Categories</h3>
                    <div class="space-y-3 font-label text-sm uppercase tracking-wider">
                        <label class="flex items-center gap-3 cursor-pointer group">
                            <input class="form-checkbox text-primary rounded-sm category-filter" type="checkbox" value="Menswear"/>
                            <span class="group-hover:text-secondary transition-colors">Menswear</span>
                        </label>
                        <label class="flex items-center gap-3 cursor-pointer group">
                            <input class="form-checkbox text-primary rounded-sm category-filter" type="checkbox" value="Womenswear"/>
                            <span class="group-hover:text-secondary transition-colors">Womenswear</span>
                        </label>
                        <label class="flex items-center gap-3 cursor-pointer group">
                            <input class="form-checkbox text-primary rounded-sm category-filter" type="checkbox" value="Accessories"/>
                            <span class="group-hover:text-secondary transition-colors">Accessories</span>
                        </label>
                        <label class="flex items-center gap-3 cursor-pointer group">
                            <input class="form-checkbox text-primary rounded-sm category-filter" type="checkbox" value="Outerwear"/>
                            <span class="group-hover:text-secondary transition-colors">Outerwear</span>
                        </label>
                        <label class="flex items-center gap-3 cursor-pointer group">
                            <input class="form-checkbox text-primary rounded-sm category-filter" type="checkbox" value="Essentials"/>
                            <span class="group-hover:text-secondary transition-colors">Essentials</span>
                        </label>
                    </div>
                </section>
                <section>
                    <h3 class="font-headline text-lg font-bold text-primary mb-6">Size</h3>
                    <div class="grid grid-cols-4 gap-2">
                        <button class="size-btn py-3 text-xs font-label border border-outline-variant/30 hover:bg-surface-container-high transition-colors" data-size="XS">XS</button>
                        <button class="size-btn py-3 text-xs font-label border border-outline-variant/30 hover:bg-surface-container-high transition-colors" data-size="S">S</button>
                        <button class="size-btn py-3 text-xs font-label border border-outline-variant/30 hover:bg-surface-container-high transition-colors" data-size="M">M</button>
                        <button class="size-btn py-3 text-xs font-label border border-outline-variant/30 hover:bg-surface-container-high transition-colors" data-size="L">L</button>
                        <button class="size-btn py-3 text-xs font-label border border-outline-variant/30 hover:bg-surface-container-high transition-colors" data-size="XL">XL</button>
                    </div>
                </section>
                <!-- Sort -->
                <section>
                    <h3 class="font-headline text-lg font-bold text-primary mb-6">Sort By</h3>
                    <select id="sort-select" class="w-full bg-surface-container-low border border-outline-variant/20 rounded-lg p-3 font-label text-sm">
                        <option value="newest">Newest First</option>
                        <option value="price-asc">Price: Low to High</option>
                        <option value="price-desc">Price: High to Low</option>
                        <option value="name">Name A–Z</option>
                    </select>
                </section>
                <button onclick="applyFilters()" class="w-full silk-finish-gradient text-on-primary py-4 font-label uppercase tracking-[0.2em] text-xs hover:opacity-90 transition-opacity rounded-lg">Apply Filters</button>
                <button onclick="clearFilters()" class="w-full border border-outline-variant/20 py-3 font-label uppercase tracking-[0.15em] text-xs text-on-surface-variant hover:bg-surface-container-low transition-colors rounded-lg">Clear Filters</button>
            </aside>

            <!-- Product Grid -->
            <div class="flex-grow">
                <div class="flex justify-between items-center mb-10 pb-4 border-b border-outline-variant/10">
                    <span id="product-count" class="font-label text-xs uppercase tracking-widest text-on-surface-variant">Curating items...</span>
                </div>
                <div id="product-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-y-16 gap-x-12"></div>
                <div id="pagination" class="mt-24 flex items-center justify-center gap-4 hidden">
                    <button onclick="changePage(-1)" class="w-12 h-12 flex items-center justify-center border border-outline-variant/30 text-on-surface-variant hover:border-primary transition-all">
                        <span class="material-symbols-outlined">chevron_left</span>
                    </button>
                    <button id="page-btn" class="w-12 h-12 flex items-center justify-center bg-primary text-on-primary font-label text-sm">1</button>
                    <button onclick="changePage(1)" class="w-12 h-12 flex items-center justify-center border border-outline-variant/30 text-on-surface-variant hover:border-primary transition-all">
                        <span class="material-symbols-outlined">chevron_right</span>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="/frontend/js/utils.js"></script>
    <script src="/frontend/js/api.js"></script>
    <script src="/frontend/js/auth.js"></script>
    <script src="/frontend/components/header.js"></script>
    <script src="/frontend/components/footer.js"></script>
    <script>
        let allProducts = [], filteredProducts = [], currentPage = 1;
        const PER_PAGE = 9;
        let wishlist = JSON.parse(localStorage.getItem('etc_wishlist') || '[]');

        // Size button toggle
        document.querySelectorAll('.size-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                btn.classList.toggle('bg-primary');
                btn.classList.toggle('text-white');
                btn.classList.toggle('border-primary');
            });
        });

        function applyFilters() {
            const checkedCats = [...document.querySelectorAll('.category-filter:checked')].map(cb => cb.value);
            const sort = document.getElementById('sort-select').value;
            let result = checkedCats.length ? allProducts.filter(p => checkedCats.includes(p.category)) : [...allProducts];
            if (sort === 'price-asc') result.sort((a, b) => parseFloat(a.price) - parseFloat(b.price));
            else if (sort === 'price-desc') result.sort((a, b) => parseFloat(b.price) - parseFloat(a.price));
            else if (sort === 'name') result.sort((a, b) => a.name.localeCompare(b.name));
            filteredProducts = result;
            currentPage = 1;
            renderProducts();
        }

        function clearFilters() {
            document.querySelectorAll('.category-filter').forEach(cb => cb.checked = false);
            document.querySelectorAll('.size-btn').forEach(btn => { btn.classList.remove('bg-primary','text-white','border-primary'); });
            document.getElementById('sort-select').value = 'newest';
            filteredProducts = [...allProducts];
            currentPage = 1;
            renderProducts();
        }

        function changePage(d) {
            const max = Math.ceil(filteredProducts.length / PER_PAGE);
            currentPage = Math.max(1, Math.min(max, currentPage + d));
            renderProducts();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleWishlist(productId, btnEl) {
            const idx = wishlist.indexOf(productId);
            if (idx === -1) {
                wishlist.push(productId);
                btnEl.querySelector('span').style.setProperty('font-variation-settings', "'FILL' 1");
                btnEl.querySelector('span').classList.add('text-error');
                showToast('Added to wishlist!', 'success');
            } else {
                wishlist.splice(idx, 1);
                btnEl.querySelector('span').style.setProperty('font-variation-settings', "'FILL' 0");
                btnEl.querySelector('span').classList.remove('text-error');
                showToast('Removed from wishlist.', 'info');
            }
            localStorage.setItem('etc_wishlist', JSON.stringify(wishlist));
        }

        function renderProducts() {
            const grid = document.getElementById('product-grid');
            const count = document.getElementById('product-count');
            const start = (currentPage - 1) * PER_PAGE;
            const page = filteredProducts.slice(start, start + PER_PAGE);
            const maxPages = Math.ceil(filteredProducts.length / PER_PAGE);
            document.getElementById('page-btn').textContent = currentPage;
            document.getElementById('pagination').classList.toggle('hidden', maxPages <= 1);
            count.textContent = `${filteredProducts.length} curated item${filteredProducts.length !== 1 ? 's' : ''} found`;

            if (!page.length) {
                grid.innerHTML = '<p class="col-span-full text-center text-on-surface-variant italic py-20">No products match your selection. Try clearing filters.</p>';
                return;
            }

            grid.innerHTML = page.map(product => {
                const inWishlist = wishlist.includes(product.id);
                const fillStyle = inWishlist ? "font-variation-settings:'FILL' 1" : '';
                return `
                <div class="group">
                    <div class="relative overflow-hidden bg-surface-container-low mb-6 rounded-lg">
                        <div class="w-full aspect-[4/5] bg-surface-container-high relative">
                            <img src="${product.image_url || 'https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&q=80'}" alt="${product.name}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                            <div class="absolute inset-0 bg-primary/5 group-hover:bg-primary/20 transition-colors"></div>
                        </div>
                        <div class="absolute bottom-4 left-4 right-4 flex gap-2 translate-y-12 opacity-0 group-hover:translate-y-0 group-hover:opacity-100 transition-all duration-500">
                            <button class="flex-grow silk-finish-gradient text-on-primary py-3 text-[10px] font-label uppercase tracking-widest rounded-l" onclick="addToCartLocal(${JSON.stringify(product).replace(/"/g, '&quot;')})">Add to Bag</button>
                            <button onclick="toggleWishlist('${product.id}', this)" class="w-12 bg-white/90 backdrop-blur-md flex items-center justify-center rounded-r shadow-sm">
                                <span class="material-symbols-outlined text-primary text-lg ${inWishlist ? 'text-error' : ''}" style="${fillStyle}">favorite</span>
                            </button>
                        </div>
                    </div>
                    <div class="space-y-2">
                        <div class="flex justify-between items-start">
                            <h3 class="font-headline font-bold text-lg text-primary leading-tight">${product.name}</h3>
                            <span class="font-label text-sm text-secondary font-semibold">$${parseFloat(product.price).toFixed(2)}</span>
                        </div>
                        <p class="font-label text-[10px] uppercase tracking-[0.15em] text-on-surface-variant/60">${product.category} · ${product.sku}</p>
                    </div>
                </div>`;
            }).join('');

            updateCartBadge();
        }

        document.addEventListener('DOMContentLoaded', async () => {
            loadHeader();
            loadFooter();
            allProducts = await fetchProducts();
            filteredProducts = [...allProducts];
            renderProducts();
        });

        document.getElementById('sort-select').addEventListener('change', applyFilters);
        document.querySelectorAll('.category-filter').forEach(cb => cb.addEventListener('change', applyFilters));
    </script>
</body>
</html>
