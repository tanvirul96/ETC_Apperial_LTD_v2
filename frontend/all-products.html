<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>All Products | ETC Apparel</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700;900&amp;family=Manrope:wght@400;500;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>


    <link rel="stylesheet" href="css/main.css">

<link rel="stylesheet" href="/frontend/css/global.css">
<script src="/frontend/js/tailwind-theme.js"></script>
</head>
<body class="bg-surface font-body text-on-surface selection:bg-secondary/30 selection:text-on-secondary-container">
<main class="pt-32 pb-24 px-8 md:px-16">
<!-- Breadcrumbs -->
<header class="mb-16">
<h1 class="font-headline text-5xl md:text-7xl font-black text-primary tracking-tighter mb-4">
                The Seasonal <span class="text-secondary">Edit</span>
</h1>
<p class="max-w-2xl text-on-surface-variant font-body leading-relaxed text-lg italic">
                A thoughtfully curated selection of essential garments designed for the modern editorial aesthetic, blending architectural precision with tactile warmth.
            </p>
</header>
<div class="flex flex-col lg:flex-row gap-12">
<!-- Sidebar Filters -->
<aside class="w-full lg:w-72 flex-shrink-0 space-y-10">
<!-- Category Section -->
<section>
<h3 class="font-headline text-lg font-bold text-primary mb-6 flex items-center justify-between">
                        Categories
                        <span class="h-[1px] flex-grow ml-4 bg-outline-variant/20"></span>
</h3>
<div class="space-y-3 font-label text-sm uppercase tracking-wider">
<label class="flex items-center gap-3 cursor-pointer group">
<input class="form-checkbox text-primary rounded-sm border-outline-variant focus:ring-secondary/30" type="checkbox"/>
<span class="group-hover:text-secondary transition-colors">Menswear</span>
</label>
<label class="flex items-center gap-3 cursor-pointer group">
<input checked="" class="form-checkbox text-primary rounded-sm border-outline-variant focus:ring-secondary/30" type="checkbox"/>
<span class="group-hover:text-secondary transition-colors">Womenswear</span>
</label>
<label class="flex items-center gap-3 cursor-pointer group">
<input class="form-checkbox text-primary rounded-sm border-outline-variant focus:ring-secondary/30" type="checkbox"/>
<span class="group-hover:text-secondary transition-colors">Kidswear</span>
</label>
</div>
</section>
<!-- Size Section -->
<section>
<h3 class="font-headline text-lg font-bold text-primary mb-6 flex items-center justify-between">
                        Size
                        <span class="h-[1px] flex-grow ml-4 bg-outline-variant/20"></span>
</h3>
<div class="grid grid-cols-4 gap-2">
<button class="py-3 text-xs font-label border border-outline-variant/30 hover:bg-surface-container-high transition-colors">XS</button>
<button class="py-3 text-xs font-label bg-primary text-white">S</button>
<button class="py-3 text-xs font-label border border-outline-variant/30 hover:bg-surface-container-high transition-colors">M</button>
<button class="py-3 text-xs font-label border border-outline-variant/30 hover:bg-surface-container-high transition-colors">L</button>
<button class="py-3 text-xs font-label border border-outline-variant/30 hover:bg-surface-container-high transition-colors">XL</button>
</div>
</section>
<!-- Color Section -->
<section>
<h3 class="font-headline text-lg font-bold text-primary mb-6 flex items-center justify-between">
                        Palette
                        <span class="h-[1px] flex-grow ml-4 bg-outline-variant/20"></span>
</h3>
<div class="flex flex-wrap gap-4">
<button class="w-8 h-8 rounded-full ring-2 ring-offset-2 ring-primary bg-[#171e29]"></button>
<button class="w-8 h-8 rounded-full ring-1 ring-outline-variant bg-[#885203]"></button>
<button class="w-8 h-8 rounded-full ring-1 ring-outline-variant bg-[#f8f3ef]"></button>
<button class="w-8 h-8 rounded-full ring-1 ring-outline-variant bg-[#3c0e00]"></button>
<button class="w-8 h-8 rounded-full ring-1 ring-outline-variant bg-[#c5c6cc]"></button>
</div>
</section>
<!-- Price Range -->
<section>
<h3 class="font-headline text-lg font-bold text-primary mb-6 flex items-center justify-between">
                        Investment
                        <span class="h-[1px] flex-grow ml-4 bg-outline-variant/20"></span>
</h3>
<div class="space-y-4">
<input class="w-full accent-secondary" type="range"/>
<div class="flex justify-between font-label text-xs uppercase tracking-widest text-on-surface-variant">
<span>$150.00</span>
<span>$4,500.00</span>
</div>
</div>
</section>
<button class="w-full silk-finish-gradient text-on-primary py-4 font-label uppercase tracking-[0.2em] text-xs hover:opacity-90 transition-opacity">
                    Apply Filters
                </button>
</aside>
<!-- Product Grid -->
<div class="flex-grow">
<div class="flex justify-between items-center mb-10 pb-4 border-b border-outline-variant/10">
<span class="font-label text-xs uppercase tracking-widest text-on-surface-variant">84 curated items found</span>
<div class="flex gap-4">
<button class="font-label text-xs uppercase tracking-widest flex items-center gap-2 text-primary">
                            Sort by: Newest
                            <span class="material-symbols-outlined text-sm" data-icon="keyboard_arrow_down">keyboard_arrow_down</span>
</button>
</div>
</div>
<div id="product-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-y-16 gap-x-12">
    <!-- Dynamic Product Cards -->
</div>
<!-- Pagination -->
<div class="mt-24 flex items-center justify-center gap-4">
<button class="w-12 h-12 flex items-center justify-center border border-outline-variant/30 text-on-surface-variant hover:border-primary transition-all">
<span class="material-symbols-outlined" data-icon="chevron_left">chevron_left</span>
</button>
<button class="w-12 h-12 flex items-center justify-center bg-primary text-on-primary font-label text-sm">1</button>
<button class="w-12 h-12 flex items-center justify-center border border-outline-variant/30 text-on-surface-variant hover:border-primary transition-all font-label text-sm">2</button>
<button class="w-12 h-12 flex items-center justify-center border border-outline-variant/30 text-on-surface-variant hover:border-primary transition-all font-label text-sm">3</button>
<span class="text-on-surface-variant font-label px-2">...</span>
<button class="w-12 h-12 flex items-center justify-center border border-outline-variant/30 text-on-surface-variant hover:border-primary transition-all font-label text-sm">12</button>
<button class="w-12 h-12 flex items-center justify-center border border-outline-variant/30 text-on-surface-variant hover:border-primary transition-all">
<span class="material-symbols-outlined" data-icon="chevron_right">chevron_right</span>
</button>
</div>
</div>
</div>
</main>
<div id="footer-placeholder"></div>

    <script src="/frontend/components/header.js"></script>
    <script src="/frontend/components/footer.js"></script>
    <script src="/frontend/js/api.js"></script>
    <script>
        loadHeader();
        loadFooter();

        document.addEventListener('DOMContentLoaded', async () => {
            const products = await fetchProducts();
            const grid = document.getElementById('product-grid');
            
            if (products && products.length > 0) {
                grid.innerHTML = products.map(product => `
                    <div class="group">
                        <div class="relative overflow-hidden bg-surface-container-low mb-6 rounded-lg">
                            <div class="w-full aspect-[4/5] bg-surface-container-high flex items-center justify-center text-primary font-bold text-xl uppercase tracking-tighter">
                                ${product.category}
                            </div>
                            <div class="absolute bottom-4 left-4 right-4 flex gap-2 translate-y-12 opacity-0 group-hover:translate-y-0 group-hover:opacity-100 transition-all duration-500">
                                <button class="flex-grow silk-finish-gradient text-on-primary py-3 text-[10px] font-label uppercase tracking-widest" onclick="addToCart('${product.id}')">Add to Bag</button>
                                <button class="w-12 bg-white/90 backdrop-blur-md flex items-center justify-center rounded-lg"><span class="material-symbols-outlined text-primary text-lg">favorite</span></button>
                            </div>
                        </div>
                        <div class="space-y-2">
                            <div class="flex justify-between items-start">
                                <h3 class="font-headline font-bold text-lg text-primary leading-tight">${product.name}</h3>
                                <span class="font-label text-sm text-secondary font-semibold">$${product.price}</span>
                            </div>
                            <p class="font-label text-[10px] uppercase tracking-[0.15em] text-on-surface-variant/60">${product.category} · ${product.sku}</p>
                        </div>
                    </div>
                `).join('');
            }
        });

        async function addToCart(productId) {
            alert('Item added to curated bag!');
            // Here you would implement real cart logic
        }
    </script>
</body></html>
